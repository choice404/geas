    PayErrorDeclined declined = 1;
    PayErrorTimeout timeout = 2;
    PayErrorGateway gateway = 3;
  }
}

// Result<AuthId, PayError>: the contract's own Err is a value, not a
// transport error.
message AuthIdPayErrorResult {
  oneof result {
    AuthId ok = 1;
    PayError err = 2;
  }
}

// The declared record Receipt, fields in declaration order.
message Receipt {
  string id = 1;
  int64 amount = 2;
