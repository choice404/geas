// bridge.proto: generated by geas emit-proto, do not edit.
// Every pledge is its own typed rpc, so a consumer gets the contract's
// argument and result types from protoc alone, with no generic Value
// envelope and no language side dispatch on a pledge name string. The
// session wrapper emitted beside this file carries the one thing protoc
// cannot, the stream whose lifetime is the instance's.

syntax = "proto3";
package geas.bridge;

// The Go package the emitted session wrapper lives in; a consumer that
// lays its module out differently overrides this with protoc's M flags.
option go_package = "geasbridge/bridgepb";

// contract Shop, version 2, shape 0x6fe34409781e3d4f.
// The sign surface: one optional field per vow, and the shape check,
// where 0 skips it and the wrapper's pinned hash enforces this build.
message ShopSignRequest {
  optional string city = 1;  // the vow; no default is declared, so unset refuses at sign
  optional bool open = 2;  // the vow; unset takes the declared default
  optional double rate = 3;  // the vow; unset takes the declared default
  uint64 expected_hash = 4;
}

// The signature: the id the pledge rpcs are keyed by, the effective vows
// after defaults and overrides, and the hash and timestamp an in process
// host reads off the handle.
message ShopSigned {
  uint64 instance_id = 1;
  string city = 2;
  bool open = 3;
  double rate = 4;
  uint64 shape_hash = 5;
  int64 signed_at = 6;
  string park_token = 7;  // the resume key a park enabled server issues; empty when parking is off
}

// What the session stream carries. Signed is the first event; the stream's
// other job is holding the session open, and anything a server later needs
// to push arrives as another arm.
message ShopSessionEvent {
  oneof event {
    ShopSigned signed = 1;
  }
}

// The resume call: the token names a parked row on the server's park
// store, and a 0 expected_hash skips the shape check the way sign's does.
message ShopResumeRequest {
  string park_token = 1;
  uint64 expected_hash = 2;
}

// The Ok of a pledge that answers with nothing; the message is the value.
message Unit {}

message ProblemMissing {
  string what = 1;
  repeated int64 where = 2;
}

message ProblemDenied {}

message ProblemBroken {
  int64 code = 1;
}

// The declared sum Problem: an arm carries fields, so it crosses as a
// message whose oneof numbering is the declared arm order, the ABI's tag space.
message Problem {
  oneof arm {
    ProblemMissing missing = 1;
    ProblemDenied denied = 2;
    ProblemBroken broken = 3;
  }
}

// Result<Unit, Problem>: the contract's own Err is a value, not a
// transport error.
message UnitProblemResult {
  oneof result {
    Unit ok = 1;
    Problem err = 2;
  }
}

// The declared sum Kind: every arm is bare, so it crosses as an
// enum whose numbering is the declared arm order, the ABI's own tag space.
enum Kind {
  KIND_SMALL = 0;
  KIND_LARGE = 1;
}

// The Map<Int, String> wrapper: Geas pins map iteration as insertion
// ordered and proto's own map type carries no order, so the bridge spells
// a map as the ordered entry list it actually is.
message IntStringMapEntry {
  int64 key = 1;
  string value = 2;
}
message IntStringMap {
  repeated IntStringMapEntry entries = 1;
}

// The declared record Item2, fields in declaration order.
message Item2 {
  double weight = 1;
  IntStringMap codes = 2;
}

// The declared record Item, fields in declaration order.
message Item {
  int64 id = 1;
  repeated string tags = 2;
  optional string note = 3;
  optional Kind kind = 4;
  Item2 extra = 5;
}

// List<Item> as a message, so a list can ride a oneof arm.
message ItemList {
  repeated Item values = 1;
}

// Result<List<Item>, Problem>: the contract's own Err is a value, not a
// transport error.
message ItemListProblemResult {
  oneof result {
    ItemList ok = 1;
    Problem err = 2;
  }
}

// Option<Item> as a message: an unset value is None.
message ItemOption {
  Item value = 1;
}

// The Tuple<Int, Bool> as a message, each element a numbered field.
message IntBoolTuple {
  int64 item1 = 1;
  bool item2 = 2;
}

// Result<Tuple<Int, Bool>, Problem>: the contract's own Err is a value, not a
// transport error.
message IntBoolTupleProblemResult {
  oneof result {
    IntBoolTuple ok = 1;
    Problem err = 2;
  }
}

// The Map<String, Int> wrapper: Geas pins map iteration as insertion
// ordered and proto's own map type carries no order, so the bridge spells
// a map as the ordered entry list it actually is.
message StringIntMapEntry {
  string key = 1;
  int64 value = 2;
}
message StringIntMap {
  repeated StringIntMapEntry entries = 1;
}

// Result<Map<String, Int>, String>: the contract's own Err is a value, not a
// transport error.
message StringIntMapStringResult {
  oneof result {
    StringIntMap ok = 1;
    string err = 2;
  }
}

// List<Int> as a message, so a list can ride a oneof arm.
message IntList {
  repeated int64 values = 1;
}

// Option<IntList> as a message: an unset value is None.
message IntListOption {
  IntList value = 1;
}

// Result<Option<List<Int>>, Kind>: the contract's own Err is a value, not a
// transport error.
message IntListOptionKindResult {
  oneof result {
    IntListOption ok = 1;
    Kind err = 2;
  }
}

message ShopSignPledgeRequest {
  uint64 instance_id = 1;
  string who = 2;
}

message ShopListItemsRequest {
  uint64 instance_id = 1;
  int64 limit = 2;
  repeated Kind kinds = 3;
}

message ShopFindItemRequest {
  uint64 instance_id = 1;
  int64 id = 2;
  optional string hint = 3;
}

// The Tuple<Int, String> as a message, each element a numbered field.
message IntStringTuple {
  int64 item1 = 1;
  string item2 = 2;
}

message ShopPayRequest {
  uint64 instance_id = 1;
  double amount = 2;
  IntStringTuple memo = 3;
}

message ShopRefundRequest {
  uint64 instance_id = 1;
  int64 id = 2;
}

// The Map<String, Bool> wrapper: Geas pins map iteration as insertion
// ordered and proto's own map type carries no order, so the bridge spells
// a map as the ordered entry list it actually is.
message StringBoolMapEntry {
  string key = 1;
  bool value = 2;
}
message StringBoolMap {
  repeated StringBoolMapEntry entries = 1;
}

message ShopAuditRequest {
  uint64 instance_id = 1;
  StringBoolMap flags = 2;
}

// contract Depot, version 1, shape 0xdbd6e085dce9db4f.
// The sign surface: one optional field per vow, and the shape check,
// where 0 skips it and the wrapper's pinned hash enforces this build.
message DepotSignRequest {
  optional string dsn = 1;  // the vow; unset takes the declared default
  uint64 expected_hash = 2;
}

// The signature: the id the pledge rpcs are keyed by, the effective vows
// after defaults and overrides, and the hash and timestamp an in process
// host reads off the handle.
message DepotSigned {
  uint64 instance_id = 1;
  string dsn = 2;
  uint64 shape_hash = 3;
  int64 signed_at = 4;
  string park_token = 5;  // the resume key a park enabled server issues; empty when parking is off
}

// What the session stream carries. Signed is the first event; the stream's
// other job is holding the session open, and anything a server later needs
// to push arrives as another arm.
message DepotSessionEvent {
  oneof event {
    DepotSigned signed = 1;
  }
}

// The resume call: the token names a parked row on the server's park
// store, and a 0 expected_hash skips the shape check the way sign's does.
message DepotResumeRequest {
  string park_token = 1;
  uint64 expected_hash = 2;
}

// Result<UInt, Problem>: the contract's own Err is a value, not a
// transport error.
message UintProblemResult {
  oneof result {
    uint64 ok = 1;
    Problem err = 2;
  }
}

// Result<Int, Int>: the contract's own Err is a value, not a
// transport error.
message IntIntResult {
  oneof result {
    int64 ok = 1;
    int64 err = 2;
  }
}

message DepotStockRequest {
  uint64 instance_id = 1;
  Item item = 2;
}

message DepotOutRequest {
  uint64 instance_id = 1;
  int64 n = 2;
}

message DepotWaitRequest {
  uint64 instance_id = 1;
  int64 n = 2;
}

// contract Empty, version 1, shape 0x384acf1ebbc740eb.
// The sign surface: one optional field per vow, and the shape check,
// where 0 skips it and the wrapper's pinned hash enforces this build.
message EmptySignRequest {
  uint64 expected_hash = 1;
}

// The signature: the id the pledge rpcs are keyed by, the effective vows
// after defaults and overrides, and the hash and timestamp an in process
// host reads off the handle.
message EmptySigned {
  uint64 instance_id = 1;
  uint64 shape_hash = 2;
  int64 signed_at = 3;
  string park_token = 4;  // the resume key a park enabled server issues; empty when parking is off
}

// What the session stream carries. Signed is the first event; the stream's
// other job is holding the session open, and anything a server later needs
// to push arrives as another arm.
message EmptySessionEvent {
  oneof event {
    EmptySigned signed = 1;
  }
}

// The resume call: the token names a parked row on the server's park
// store, and a 0 expected_hash skips the shape check the way sign's does.
message EmptyResumeRequest {
  string park_token = 1;
  uint64 expected_hash = 2;
}

// The lifecycle states, GEAS_UNSIGNED through GEAS_BROKEN, in the runtime's
// own numbering.
enum ContractState {
  UNSIGNED = 0;
  SIGNED = 1;
  FULFILLED = 2;
  PARTIAL = 3;
  BROKEN = 4;
}

message PledgeError { string pledge = 1; int64 err = 2; }

message PartialRequest { uint64 instance_id = 1; }

// The partial surface, name lists in the runtime's insertion order.
// repeated, not map, so the order Geas pins as normative survives the
// wire.
message PartialReply {
  ContractState state = 1;
  repeated string fulfilled = 2;
  repeated string pending = 3;
  repeated string broken = 4;
  repeated PledgeError errors = 5;
}

message BreakRequest { uint64 instance_id = 1; }
message BreakReply {}

service Shop {
  // Signs, then holds. The first event carries the signature; the stream
  // then stays open and empty for as long as the instance lives. Ending the
  // stream, by close, by cancel, or by dying, ends the instance.
  rpc Session(ShopSignRequest) returns (stream ShopSessionEvent);
  // A parked instance stood back up: the stream is once again the
  // instance's life, and its first event carries the signature.
  rpc Resume(ShopResumeRequest) returns (stream ShopSessionEvent);
  rpc Sign(ShopSignPledgeRequest) returns (UnitProblemResult);
  rpc ListItems(ShopListItemsRequest) returns (ItemListProblemResult);
  rpc FindItem(ShopFindItemRequest) returns (ItemOption);
  rpc Pay(ShopPayRequest) returns (IntBoolTupleProblemResult);
  rpc Refund(ShopRefundRequest) returns (StringIntMapStringResult);
  rpc Audit(ShopAuditRequest) returns (IntListOptionKindResult);
  rpc GetPartial(PartialRequest) returns (PartialReply);
  rpc Break(BreakRequest) returns (BreakReply);
}

service Depot {
  // Signs, then holds. The first event carries the signature; the stream
  // then stays open and empty for as long as the instance lives. Ending the
  // stream, by close, by cancel, or by dying, ends the instance.
  rpc Session(DepotSignRequest) returns (stream DepotSessionEvent);
  // A parked instance stood back up: the stream is once again the
  // instance's life, and its first event carries the signature.
  rpc Resume(DepotResumeRequest) returns (stream DepotSessionEvent);
  rpc Stock(DepotStockRequest) returns (UintProblemResult);
  rpc Out(DepotOutRequest) returns (IntIntResult);
  rpc Wait(DepotWaitRequest) returns (IntIntResult);
  rpc GetPartial(PartialRequest) returns (PartialReply);
  rpc Break(BreakRequest) returns (BreakReply);
}

service Empty {
  // Signs, then holds. The first event carries the signature; the stream
  // then stays open and empty for as long as the instance lives. Ending the
  // stream, by close, by cancel, or by dying, ends the instance.
  rpc Session(EmptySignRequest) returns (stream EmptySessionEvent);
  // A parked instance stood back up: the stream is once again the
  // instance's life, and its first event carries the signature.
  rpc Resume(EmptyResumeRequest) returns (stream EmptySessionEvent);
  rpc GetPartial(PartialRequest) returns (PartialReply);
  rpc Break(BreakRequest) returns (BreakReply);
}
