// flowdesk.proto: generated by geas emit-proto, do not edit.
// Every pledge is its own typed rpc, so a consumer gets the contract's
// argument and result types from protoc alone, with no generic Value
// envelope and no language side dispatch on a pledge name string. The
// session wrapper emitted beside this file carries the one thing protoc
// cannot, the stream whose lifetime is the instance's.

syntax = "proto3";
package geas.flowdesk;

// The Go package the emitted session wrapper lives in; a consumer that
// lays its module out differently overrides this with protoc's M flags.
option go_package = "geasbridge/flowdeskpb";

// contract Courier, version 1, shape 0xa75e59e7dac071df.
// The sign surface: one optional field per vow, and the shape check,
// where 0 skips it and the wrapper's pinned hash enforces this build.
message CourierSignRequest {
  uint64 expected_hash = 1;
}

// The signature: the id the pledge rpcs are keyed by, the effective vows
// after defaults and overrides, and the hash and timestamp an in process
// host reads off the handle.
message CourierSigned {
  uint64 instance_id = 1;
  uint64 shape_hash = 2;
  int64 signed_at = 3;
  string park_token = 4;  // the resume key a park enabled server issues; empty when parking is off
}

// What the session stream carries. Signed is the first event; the stream's
// other job is holding the session open, and anything a server later needs
// to push arrives as another arm.
message CourierSessionEvent {
  oneof event {
    CourierSigned signed = 1;
  }
}

// The resume call: the token names a parked row on the server's park
// store, and a 0 expected_hash skips the shape check the way sign's does.
message CourierResumeRequest {
  string park_token = 1;
  uint64 expected_hash = 2;
}

// The declared record Parcel, fields in declaration order.
message Parcel {
  string code = 1;
  int64 weight = 2;
}

// Result<Parcel, Int>: the contract's own Err is a value, not a
// transport error.
message ParcelIntResult {
  oneof result {
    Parcel ok = 1;
    int64 err = 2;
  }
}

message CourierPickupRequest {
  uint64 instance_id = 1;
  string code = 2;
}

// signal scanned, delivered into a live instance.
message CourierSignalScannedRequest {
  uint64 instance_id = 1;
  int64 at = 2;
}

// contract Desk, version 1, shape 0xfd5046c594794ce1.
// The sign surface: one optional field per vow, and the shape check,
// where 0 skips it and the wrapper's pinned hash enforces this build.
message DeskSignRequest {
  uint64 expected_hash = 1;
}

// The signature: the id the pledge rpcs are keyed by, the effective vows
// after defaults and overrides, and the hash and timestamp an in process
// host reads off the handle.
message DeskSigned {
  uint64 instance_id = 1;
  uint64 shape_hash = 2;
  int64 signed_at = 3;
  string park_token = 4;  // the resume key a park enabled server issues; empty when parking is off
}

// What the session stream carries. Signed is the first event; the stream's
// other job is holding the session open, and anything a server later needs
// to push arrives as another arm.
message DeskSessionEvent {
  oneof event {
    DeskSigned signed = 1;
  }
}

// The resume call: the token names a parked row on the server's park
// store, and a 0 expected_hash skips the shape check the way sign's does.
message DeskResumeRequest {
  string park_token = 1;
  uint64 expected_hash = 2;
}

// Result<String, Int>: the contract's own Err is a value, not a
// transport error.
message StringIntResult {
  oneof result {
    string ok = 1;
    int64 err = 2;
  }
}

// Result<Duration, Int>: the contract's own Err is a value, not a
// transport error.
message DurationIntResult {
  oneof result {
    int64 ok = 1;
    int64 err = 2;
  }
}

// Result<Time, Int>: the contract's own Err is a value, not a
// transport error.
message TimeIntResult {
  oneof result {
    int64 ok = 1;
    int64 err = 2;
  }
}

// The Tuple<String, Int> as a message, each element a numbered field.
message StringIntTuple {
  string item1 = 1;
  int64 item2 = 2;
}

// Result<Tuple<String, Int>, Int>: the contract's own Err is a value, not a
// transport error.
message StringIntTupleIntResult {
  oneof result {
    StringIntTuple ok = 1;
    int64 err = 2;
  }
}

message DeskDispatchRequest {
  uint64 instance_id = 1;
  string code = 2;
  int64 at = 3;
}

message DeskEarlyRequest {
  uint64 instance_id = 1;
  int64 at = 2;
}

message DeskSpanRequest {
  uint64 instance_id = 1;
  int64 from = 2;
  int64 to = 3;
}

message DeskUntilRequest {
  uint64 instance_id = 1;
  int64 at = 2;
  int64 limit = 3;
}

message DeskBundleRequest {
  uint64 instance_id = 1;
  string code = 2;
}

// The lifecycle states, GEAS_UNSIGNED through GEAS_REMEDYING, in the
// runtime's own numbering. REMEDYING is the break decided with the remedies
// still running, and it is always followed by BROKEN.
enum ContractState {
  UNSIGNED = 0;
  SIGNED = 1;
  FULFILLED = 2;
  PARTIAL = 3;
  BROKEN = 4;
  REMEDYING = 5;
}

message PledgeError { string pledge = 1; int64 err = 2; }

message PartialRequest { uint64 instance_id = 1; }

// The partial surface, name lists in the runtime's insertion order.
// repeated, not map, so the order Geas pins as normative survives the
// wire.
message PartialReply {
  ContractState state = 1;
  repeated string fulfilled = 2;
  repeated string pending = 3;
  repeated string broken = 4;
  repeated PledgeError errors = 5;
}

message BreakRequest { uint64 instance_id = 1; }
message BreakReply {}

// The answer of every signal rpc: the delivery landed, or a repeat of one
// that already had, which changes nothing. A refusal is the call's status.
message SignalReply {}

service Courier {
  // Signs, then holds. The first event carries the signature; the stream
  // then stays open and empty for as long as the instance lives. Ending the
  // stream, by close, by cancel, or by dying, ends the instance.
  rpc Session(CourierSignRequest) returns (stream CourierSessionEvent);
  // A parked instance stood back up: the stream is once again the
  // instance's life, and its first event carries the signature.
  rpc Resume(CourierResumeRequest) returns (stream CourierSessionEvent);
  rpc Pickup(CourierPickupRequest) returns (ParcelIntResult);
  // A signal is an outside event the host delivers: no body runs, the
  // first delivery wins, and a refused delivery is the call's status.
  rpc SignalScanned(CourierSignalScannedRequest) returns (SignalReply);
  rpc GetPartial(PartialRequest) returns (PartialReply);
  rpc Break(BreakRequest) returns (BreakReply);
}

service Desk {
  // Signs, then holds. The first event carries the signature; the stream
  // then stays open and empty for as long as the instance lives. Ending the
  // stream, by close, by cancel, or by dying, ends the instance.
  rpc Session(DeskSignRequest) returns (stream DeskSessionEvent);
  // A parked instance stood back up: the stream is once again the
  // instance's life, and its first event carries the signature.
  rpc Resume(DeskResumeRequest) returns (stream DeskSessionEvent);
  rpc Dispatch(DeskDispatchRequest) returns (StringIntResult);
  rpc Early(DeskEarlyRequest) returns (StringIntResult);
  rpc Span(DeskSpanRequest) returns (DurationIntResult);
  rpc Until(DeskUntilRequest) returns (TimeIntResult);
  rpc Bundle(DeskBundleRequest) returns (StringIntTupleIntResult);
  rpc GetPartial(PartialRequest) returns (PartialReply);
  rpc Break(BreakRequest) returns (BreakReply);
}
