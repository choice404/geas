// The declared record Reservation, fields in declaration order.
message Reservation {
  string id = 1;
  string sku = 2;
  int64 hold = 3;
}

message StockErrorOutOfStock {
  string sku = 1;
}

message StockErrorUnavailable {}

// The declared sum StockError: an arm carries fields, so it crosses as a
// message whose oneof numbering is the declared arm order, the ABI's tag space.
message StockError {
  oneof arm {
    StockErrorOutOfStock out_of_stock = 1;
    StockErrorUnavailable unavailable = 2;
  }
}

// Result<Reservation, StockError>: the contract's own Err is a value, not a
