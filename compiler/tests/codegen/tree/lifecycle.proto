message DriverResumeRequest {
  string park_token = 1;
  uint64 expected_hash = 2;
}

// Result<String, Int>: the contract's own Err is a value, not a
// transport error.
message StringIntResult {
  oneof result {
    string ok = 1;
    int64 err = 2;
  }
}

message DriverWalkRequest {
  uint64 instance_id = 1;
}

message DriverPanelRequest {
  uint64 instance_id = 1;
}

message DriverBadParkRequest {
  uint64 instance_id = 1;
