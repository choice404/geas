// boundary.proto: generated by geas emit-proto, do not edit.
// Every pledge is its own typed rpc, so a consumer gets the contract's
// argument and result types from protoc alone, with no generic Value
// envelope and no language side dispatch on a pledge name string. The
// session wrapper emitted beside this file carries the one thing protoc
// cannot, the stream whose lifetime is the instance's.

syntax = "proto3";
package geas.boundary;

// The Go package the emitted session wrapper lives in; a consumer that
// lays its module out differently overrides this with protoc's M flags.
option go_package = "geasbridge/boundarypb";

// contract Boundary, version 1, shape 0x24ff355787b77a80.
// The sign surface: one optional field per vow, and the shape check,
// where 0 skips it and the wrapper's pinned hash enforces this build.
message BoundarySignRequest {
  optional string label = 1;  // the vow; unset takes the declared default
  optional bool live = 2;  // the vow; unset takes the declared default
  optional int64 limit = 3;  // the vow; unset takes the declared default
  optional bytes seed = 4;  // the vow; no default is declared, so unset refuses at sign
  optional int64 grace = 5;  // the vow; unset takes the declared default
  uint64 expected_hash = 6;
}

// The signature: the id the pledge rpcs are keyed by, the effective vows
// after defaults and overrides, and the hash and timestamp an in process
// host reads off the handle.
message BoundarySigned {
  uint64 instance_id = 1;
  string label = 2;
  bool live = 3;
  int64 limit = 4;
  bytes seed = 5;
  int64 grace = 6;
  uint64 shape_hash = 7;
  int64 signed_at = 8;
  string park_token = 9;  // the resume key a park enabled server issues; empty when parking is off
}

// What the session stream carries. Signed is the first event; the stream's
// other job is holding the session open, and anything a server later needs
// to push arrives as another arm.
message BoundarySessionEvent {
  oneof event {
    BoundarySigned signed = 1;
  }
}

// The resume call: the token names a parked row on the server's park
// store, and a 0 expected_hash skips the shape check the way sign's does.
message BoundaryResumeRequest {
  string park_token = 1;
  uint64 expected_hash = 2;
}

message ShipErrorMissing {}

message ShipErrorRefused {
  int64 code = 1;
  string note = 2;
}

// The declared sum ShipError: an arm carries fields, so it crosses as a
// message whose oneof numbering is the declared arm order, the ABI's tag space.
message ShipError {
  oneof arm {
    ShipErrorMissing missing = 1;
    ShipErrorRefused refused = 2;
  }
}

// Result<String, ShipError>: the contract's own Err is a value, not a
// transport error.
message StringShipErrorResult {
  oneof result {
    string ok = 1;
    ShipError err = 2;
  }
}

// Result<Float, ShipError>: the contract's own Err is a value, not a
// transport error.
message FloatShipErrorResult {
  oneof result {
    double ok = 1;
    ShipError err = 2;
  }
}

// Result<Int, String>: the contract's own Err is a value, not a
// transport error.
message IntStringResult {
  oneof result {
    int64 ok = 1;
    string err = 2;
  }
}

// The declared record Address, fields in declaration order.
message Address {
  string street = 1;
  uint64 zip = 2;
}

// Result<Address, ShipError>: the contract's own Err is a value, not a
// transport error.
message AddressShipErrorResult {
  oneof result {
    Address ok = 1;
    ShipError err = 2;
  }
}

// Option<Address> as a message: an unset value is None.
message AddressOption {
  Address value = 1;
}

// The declared record Customer, fields in declaration order.
message Customer {
  string name = 1;
  Address address = 2;
  repeated string tags = 3;
  optional string nick = 4;
}

message BoundaryGreetRequest {
  uint64 instance_id = 1;
  Customer customer = 2;
}

message ShapeDot {}

message ShapeCircle {
  double radius = 1;
}

message ShapeGroup {
  repeated Shape parts = 1;
  string label = 2;
}

// The declared sum Shape: an arm carries fields, so it crosses as a
// message whose oneof numbering is the declared arm order, the ABI's tag space.
message Shape {
  oneof arm {
    ShapeDot dot = 1;
    ShapeCircle circle = 2;
    ShapeGroup group = 3;
  }
}

message BoundaryMeasureRequest {
  uint64 instance_id = 1;
  Shape shape = 2;
}

// The Map<String, Int> wrapper: Geas pins map iteration as insertion
// ordered and proto's own map type carries no order, so the bridge spells
// a map as the ordered entry list it actually is.
message StringIntMapEntry {
  string key = 1;
  int64 value = 2;
}
message StringIntMap {
  repeated StringIntMapEntry entries = 1;
}

// The Tuple<Int, String> as a message, each element a numbered field.
message IntStringTuple {
  int64 item1 = 1;
  string item2 = 2;
}

message BoundaryTallyRequest {
  uint64 instance_id = 1;
  StringIntMap scores = 2;
  IntStringTuple pair = 3;
}

// The declared record Category, fields in declaration order.
message Category {
  string title = 1;
  repeated Category children = 2;
}

message BoundaryCensusRequest {
  uint64 instance_id = 1;
  Category root = 2;
}

// The Map<Char, Int> wrapper: Geas pins map iteration as insertion
// ordered and proto's own map type carries no order, so the bridge spells
// a map as the ordered entry list it actually is.
message CharIntMapEntry {
  uint32 key = 1;
  int64 value = 2;
}
message CharIntMap {
  repeated CharIntMapEntry entries = 1;
}

message BoundaryStampRequest {
  uint64 instance_id = 1;
  bytes data = 2;
  int64 wait = 3;
  bool flag = 4;
  CharIntMap marks = 5;
}

message BoundaryPickRequest {
  uint64 instance_id = 1;
  optional int64 maybe = 2;
  int64 floor = 3;
}

message BoundaryNoteRequest {
  uint64 instance_id = 1;
  int64 count = 2;
  string text = 3;
}

message BoundaryLookupRequest {
  uint64 instance_id = 1;
  Customer customer = 2;
  int64 wait = 3;
}

message BoundaryFindRequest {
  uint64 instance_id = 1;
  string name = 2;
}

// List<Int> as a message, so a list can ride a oneof arm.
message IntList {
  repeated int64 values = 1;
}

// The Map<Int, List<Int>> wrapper: Geas pins map iteration as insertion
// ordered and proto's own map type carries no order, so the bridge spells
// a map as the ordered entry list it actually is.
message IntIntListMapEntry {
  int64 key = 1;
  IntList value = 2;
}
message IntIntListMap {
  repeated IntIntListMapEntry entries = 1;
}

// signal arrived, delivered into a live instance.
message BoundarySignalArrivedRequest {
  uint64 instance_id = 1;
  Customer customer = 2;
  IntIntListMap codes = 3;
}

// signal shaped, delivered into a live instance.
message BoundarySignalShapedRequest {
  uint64 instance_id = 1;
  Shape shape = 2;
}

// contract BoundaryCourse, version 1, shape 0x94be4c35e3eac0a7.
// The sign surface: one optional field per vow, and the shape check,
// where 0 skips it and the wrapper's pinned hash enforces this build.
message BoundaryCourseSignRequest {
  optional int64 id = 1;  // the vow; unset takes the declared default
  uint64 expected_hash = 2;
}

// The signature: the id the pledge rpcs are keyed by, the effective vows
// after defaults and overrides, and the hash and timestamp an in process
// host reads off the handle.
message BoundaryCourseSigned {
  uint64 instance_id = 1;
  int64 id = 2;
  uint64 shape_hash = 3;
  int64 signed_at = 4;
  string park_token = 5;  // the resume key a park enabled server issues; empty when parking is off
}

// What the session stream carries. Signed is the first event; the stream's
// other job is holding the session open, and anything a server later needs
// to push arrives as another arm.
message BoundaryCourseSessionEvent {
  oneof event {
    BoundaryCourseSigned signed = 1;
  }
}

// The resume call: the token names a parked row on the server's park
// store, and a 0 expected_hash skips the shape check the way sign's does.
message BoundaryCourseResumeRequest {
  string park_token = 1;
  uint64 expected_hash = 2;
}

// The lifecycle states, GEAS_UNSIGNED through GEAS_REMEDYING, in the
// runtime's own numbering. REMEDYING is the break decided with the remedies
// still running, and it is always followed by BROKEN.
enum ContractState {
  UNSIGNED = 0;
  SIGNED = 1;
  FULFILLED = 2;
  PARTIAL = 3;
  BROKEN = 4;
  REMEDYING = 5;
}

message PledgeError { string pledge = 1; int64 err = 2; }

message PartialRequest { uint64 instance_id = 1; }

// The partial surface, name lists in the runtime's insertion order.
// repeated, not map, so the order Geas pins as normative survives the
// wire.
message PartialReply {
  ContractState state = 1;
  repeated string fulfilled = 2;
  repeated string pending = 3;
  repeated string broken = 4;
  repeated PledgeError errors = 5;
}

message BreakRequest { uint64 instance_id = 1; }
message BreakReply {}

// The answer of every signal rpc: the delivery landed, or a repeat of one
// that already had, which changes nothing. A refusal is the call's status.
message SignalReply {}

// Where a course stands, GEAS_COURSE_NONE through GEAS_COURSE_CANCELLED in
// the runtime's own numbering. RUNNING is scheduled or inside a step,
// WAITING is suspended at an await, a sleep, a select, or a together,
// FINISHED ran to its end, HALTED stopped on the status in CourseReply,
// and CANCELLED was cut off by a break or the contract breaking.
enum CourseState {
  COURSE_NONE = 0;
  COURSE_RUNNING = 1;
  COURSE_WAITING = 2;
  COURSE_FINISHED = 3;
  COURSE_HALTED = 4;
  COURSE_CANCELLED = 5;
}

message CourseRequest { uint64 instance_id = 1; }

// The course as geas_course_info reads it: the step it is at or ended on,
// the GeasStatus that halted it, 0 otherwise, and the runtime clock time
// its pending wait falls due, 0 when nothing is due.
message CourseReply {
  CourseState state = 1;
  uint32 step = 2;
  uint32 status = 3;
  int64 wait_due_ms = 4;
}

service Boundary {
  // Signs, then holds. The first event carries the signature; the stream
  // then stays open and empty for as long as the instance lives. Ending the
  // stream, by close, by cancel, or by dying, ends the instance.
  rpc Session(BoundarySignRequest) returns (stream BoundarySessionEvent);
  // A parked instance stood back up: the stream is once again the
  // instance's life, and its first event carries the signature.
  rpc Resume(BoundaryResumeRequest) returns (stream BoundarySessionEvent);
  rpc Greet(BoundaryGreetRequest) returns (StringShipErrorResult);
  rpc Measure(BoundaryMeasureRequest) returns (FloatShipErrorResult);
  rpc Tally(BoundaryTallyRequest) returns (IntStringResult);
  rpc Census(BoundaryCensusRequest) returns (IntStringResult);
  rpc Stamp(BoundaryStampRequest) returns (IntStringResult);
  rpc Pick(BoundaryPickRequest) returns (IntStringResult);
  rpc Note(BoundaryNoteRequest) returns (IntStringResult);
  rpc Lookup(BoundaryLookupRequest) returns (AddressShipErrorResult);
  rpc Find(BoundaryFindRequest) returns (AddressOption);
  // A signal is an outside event the host delivers: no body runs, the
  // first delivery wins, and a refused delivery is the call's status.
  rpc SignalArrived(BoundarySignalArrivedRequest) returns (SignalReply);
  rpc SignalShaped(BoundarySignalShapedRequest) returns (SignalReply);
  rpc GetPartial(PartialRequest) returns (PartialReply);
  rpc Break(BreakRequest) returns (BreakReply);
}

service BoundaryCourse {
  // Signs, then holds. The first event carries the signature; the stream
  // then stays open and empty for as long as the instance lives. Ending the
  // stream, by close, by cancel, or by dying, ends the instance.
  rpc Session(BoundaryCourseSignRequest) returns (stream BoundaryCourseSessionEvent);
  // A parked instance stood back up: the stream is once again the
  // instance's life, and its first event carries the signature.
  rpc Resume(BoundaryCourseResumeRequest) returns (stream BoundaryCourseSessionEvent);
  // Engine driven: the contract's course runs its pledges, so a client
  // starts the instance with Session and moves it on with its signals.
  rpc GetPartial(PartialRequest) returns (PartialReply);
  // Where the course stands, read without waiting on it.
  rpc GetCourse(CourseRequest) returns (CourseReply);
  rpc Break(BreakRequest) returns (BreakReply);
}
