// bytes.proto: generated by geas emit-proto, do not edit.
// Every pledge is its own typed rpc, so a consumer gets the contract's
// argument and result types from protoc alone, with no generic Value
// envelope and no language side dispatch on a pledge name string. The
// session wrapper emitted beside this file carries the one thing protoc
// cannot, the stream whose lifetime is the instance's.

syntax = "proto3";
package geas.bytes;

// The Go package the emitted session wrapper lives in; a consumer that
// lays its module out differently overrides this with protoc's M flags.
option go_package = "geasbridge/bytespb";

// contract Buffer, version 1, shape 0x4b1f1cc71457d4df.
// The sign surface: one optional field per vow, and the shape check,
// where 0 skips it and the wrapper's pinned hash enforces this build.
message SignRequest {
  optional bytes seed = 1;  // the vow; no default is declared, so unset refuses at sign
  uint64 expected_hash = 2;
}

// The signature: the id the pledge rpcs are keyed by, the effective vows
// after defaults and overrides, and the hash and timestamp an in process
// host reads off the handle.
message Signed {
  uint64 instance_id = 1;
  bytes seed = 2;
  uint64 shape_hash = 3;
  int64 signed_at = 4;
  string park_token = 5;  // the resume key a park enabled server issues; empty when parking is off
}

// What the session stream carries. Signed is the first event; the stream's
// other job is holding the session open, and anything a server later needs
// to push arrives as another arm.
message SessionEvent {
  oneof event {
    Signed signed = 1;
  }
}

// The resume call: the token names a parked row on the server's park
// store, and a 0 expected_hash skips the shape check the way sign's does.
message ResumeRequest {
  string park_token = 1;
  uint64 expected_hash = 2;
}

message BytesValue { bytes value = 1; }

// Result<Bytes, Bytes>: the contract's own Err is a value, not a
// transport error.
message BytesBytesResult {
  oneof result {
    bytes ok = 1;
    bytes err = 2;
  }
}

// Result<Bytes, Int>: the contract's own Err is a value, not a
// transport error.
message BytesIntResult {
  oneof result {
    bytes ok = 1;
    int64 err = 2;
  }
}

// Option<String> as a message: an unset value is None.
message StringOption {
  optional string value = 1;
}

// Option<Bytes> as a message: an unset value is None.
message BytesOption {
  optional bytes value = 1;
}

// Result<Bool, Int>: the contract's own Err is a value, not a
// transport error.
message BoolIntResult {
  oneof result {
    bool ok = 1;
    int64 err = 2;
  }
}

// The declared record Packet, fields in declaration order.
message Packet {
  bytes data = 1;
}

// List<Bytes> as a message, so a list can ride a oneof arm.
message BytesList {
  repeated bytes values = 1;
}

// The Map<String, Bytes> wrapper: Geas pins map iteration as insertion
// ordered and proto's own map type carries no order, so the bridge spells
// a map as the ordered entry list it actually is.
message StringBytesMapEntry {
  string key = 1;
  bytes value = 2;
}
message StringBytesMap {
  repeated StringBytesMapEntry entries = 1;
}

// The Tuple<Packet, List<Bytes>, Map<String, Bytes>> as a message, each element a numbered field.
message PacketBytesListStringBytesMapTuple {
  Packet item1 = 1;
  BytesList item2 = 2;
  StringBytesMap item3 = 3;
}

// Result<Tuple<Packet, List<Bytes>, Map<String, Bytes>>, Int>: the contract's own Err is a value, not a
// transport error.
message PacketBytesListStringBytesMapTupleIntResult {
  oneof result {
    PacketBytesListStringBytesMapTuple ok = 1;
    int64 err = 2;
  }
}

message PacketPayloadNoData {}

message PacketPayloadData {
  bytes data = 1;
}

// The declared sum PacketPayload: an arm carries fields, so it crosses as a
// message whose oneof numbering is the declared arm order, the ABI's tag space.
message PacketPayload {
  oneof arm {
    PacketPayloadNoData no_data = 1;
    PacketPayloadData data = 2;
  }
}

// Result<PacketPayload, Bytes>: the contract's own Err is a value, not a
// transport error.
message PacketPayloadBytesResult {
  oneof result {
    PacketPayload ok = 1;
    bytes err = 2;
  }
}

message RawRequest {
  uint64 instance_id = 1;
  bytes data = 2;
}

message HostRequest {
  uint64 instance_id = 1;
  bytes data = 2;
}

message ConvertRequest {
  uint64 instance_id = 1;
  bytes data = 2;
  string label = 3;
}

message DecodeRequest {
  uint64 instance_id = 1;
  bytes data = 2;
}

message MaybeRequest {
  uint64 instance_id = 1;
  bytes data = 2;
}

message CompareRequest {
  uint64 instance_id = 1;
  bytes left = 2;
  bytes right = 3;
}

message ContainersRequest {
  uint64 instance_id = 1;
  bytes data = 2;
}

message PayloadRequest {
  uint64 instance_id = 1;
  bytes data = 2;
}

// signal received, delivered into a live instance.
message SignalReceivedRequest {
  uint64 instance_id = 1;
  bytes data = 2;
}

// The lifecycle states, GEAS_UNSIGNED through GEAS_REMEDYING, in the
// runtime's own numbering. REMEDYING is the break decided with the remedies
// still running, and it is always followed by BROKEN.
enum ContractState {
  UNSIGNED = 0;
  SIGNED = 1;
  FULFILLED = 2;
  PARTIAL = 3;
  BROKEN = 4;
  REMEDYING = 5;
}

message PledgeError { string pledge = 1; int64 err = 2; }

message PartialRequest { uint64 instance_id = 1; }

// The partial surface, name lists in the runtime's insertion order.
// repeated, not map, so the order Geas pins as normative survives the
// wire.
message PartialReply {
  ContractState state = 1;
  repeated string fulfilled = 2;
  repeated string pending = 3;
  repeated string broken = 4;
  repeated PledgeError errors = 5;
}

message BreakRequest { uint64 instance_id = 1; }
message BreakReply {}

// The answer of every signal rpc: the delivery landed, or a repeat of one
// that already had, which changes nothing. A refusal is the call's status.
message SignalReply {}

service Buffer {
  // Signs, then holds. The first event carries the signature; the stream
  // then stays open and empty for as long as the instance lives. Ending the
  // stream, by close, by cancel, or by dying, ends the instance.
  rpc Session(SignRequest) returns (stream SessionEvent);
  // A parked instance stood back up: the stream is once again the
  // instance's life, and its first event carries the signature.
  rpc Resume(ResumeRequest) returns (stream SessionEvent);
  rpc Raw(RawRequest) returns (BytesValue);
  rpc Host(HostRequest) returns (BytesBytesResult);
  rpc Convert(ConvertRequest) returns (BytesIntResult);
  rpc Decode(DecodeRequest) returns (StringOption);
  rpc Maybe(MaybeRequest) returns (BytesOption);
  rpc Compare(CompareRequest) returns (BoolIntResult);
  rpc Containers(ContainersRequest) returns (PacketBytesListStringBytesMapTupleIntResult);
  rpc Payload(PayloadRequest) returns (PacketPayloadBytesResult);
  // A signal is an outside event the host delivers: no body runs, the
  // first delivery wins, and a refused delivery is the call's status.
  rpc SignalReceived(SignalReceivedRequest) returns (SignalReply);
  rpc GetPartial(PartialRequest) returns (PartialReply);
  rpc Break(BreakRequest) returns (BreakReply);
}
