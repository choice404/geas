// The declared record Tracking, fields in declaration order.
message Tracking {
  string carrier = 1;
  string code = 2;
}

message ShipErrorNoCarrier {}

message ShipErrorRefused {
  string reason = 1;
}

// The declared sum ShipError: an arm carries fields, so it crosses as a
// message whose oneof numbering is the declared arm order, the ABI's tag space.
message ShipError {
  oneof arm {
    ShipErrorNoCarrier no_carrier = 1;
    ShipErrorRefused refused = 2;
  }
}

// Result<Tracking, ShipError>: the contract's own Err is a value, not a
