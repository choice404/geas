// store_extra.proto: generated by geas emit-proto, do not edit.
// Every pledge is its own typed rpc, so a consumer gets the contract's
// argument and result types from protoc alone, with no generic Value
// envelope and no language side dispatch on a pledge name string. The
// session wrapper emitted beside this file carries the one thing protoc
// cannot, the stream whose lifetime is the instance's.

syntax = "proto3";
package geas.store_extra;

// The Go package the emitted session wrapper lives in; a consumer that
// lays its module out differently overrides this with protoc's M flags.
option go_package = "geasbridge/store_extrapb";

// contract Stock, version 1, shape 0xbb41a8d512125365.
// The sign surface: one optional field per vow, and the shape check,
// where 0 skips it and the wrapper's pinned hash enforces this build.
message SignRequest {
  optional string dsn = 1;  // the vow; unset takes the declared default
  uint64 expected_hash = 2;
}

// The signature: the id the pledge rpcs are keyed by, the effective vows
// after defaults and overrides, and the hash and timestamp an in process
// host reads off the handle.
message Signed {
  uint64 instance_id = 1;
  string dsn = 2;
  uint64 shape_hash = 3;
  int64 signed_at = 4;
  string park_token = 5;  // the resume key a park enabled server issues; empty when parking is off
}

// What the session stream carries. Signed is the first event; the stream's
// other job is holding the session open, and anything a server later needs
// to push arrives as another arm.
message SessionEvent {
  oneof event {
    Signed signed = 1;
  }
}

// The resume call: the token names a parked row on the server's park
// store, and a 0 expected_hash skips the shape check the way sign's does.
message ResumeRequest {
  string park_token = 1;
  uint64 expected_hash = 2;
}

// The Ok of a pledge that answers with nothing; the message is the value.
message Unit {}

// The declared sum StoreError: every arm is bare, so it crosses as an
// enum whose numbering is the declared arm order, the ABI's own tag space.
enum StoreError {
  STORE_ERROR_STORE_DECODE = 0;
  STORE_ERROR_STORE_SHAPE = 1;
}

// Result<Unit, StoreError>: the contract's own Err is a value, not a
// transport error.
message UnitStoreErrorResult {
  oneof result {
    Unit ok = 1;
    StoreError err = 2;
  }
}

// The declared record Parts, fields in declaration order.
message Parts {
  int64 id = 1;
  string name = 2;
  int64 qty = 3;
  double price = 4;
  bool live = 5;
}

// List<Parts> as a message, so a list can ride a oneof arm.
message PartsList {
  repeated Parts values = 1;
}

// Result<List<Parts>, StoreError>: the contract's own Err is a value, not a
// transport error.
message PartsListStoreErrorResult {
  oneof result {
    PartsList ok = 1;
    StoreError err = 2;
  }
}

// Result<Int, StoreError>: the contract's own Err is a value, not a
// transport error.
message IntStoreErrorResult {
  oneof result {
    int64 ok = 1;
    StoreError err = 2;
  }
}

// Result<Float, StoreError>: the contract's own Err is a value, not a
// transport error.
message FloatStoreErrorResult {
  oneof result {
    double ok = 1;
    StoreError err = 2;
  }
}

// Option<Int> as a message: an unset value is None.
message IntOption {
  optional int64 value = 1;
}

// Result<Option<Int>, StoreError>: the contract's own Err is a value, not a
// transport error.
message IntOptionStoreErrorResult {
  oneof result {
    IntOption ok = 1;
    StoreError err = 2;
  }
}

// Option<Float> as a message: an unset value is None.
message FloatOption {
  optional double value = 1;
}

// Result<Option<Float>, StoreError>: the contract's own Err is a value, not a
// transport error.
message FloatOptionStoreErrorResult {
  oneof result {
    FloatOption ok = 1;
    StoreError err = 2;
  }
}

message DropRequest {
  uint64 instance_id = 1;
  int64 id = 2;
}

message NamedRequest {
  uint64 instance_id = 1;
  string n = 2;
}

message OutsideRequest {
  uint64 instance_id = 1;
  int64 a = 2;
  int64 b = 3;
}

message TopRequest {
  uint64 instance_id = 1;
  int64 a = 2;
  int64 b = 3;
  int64 k = 4;
}

message NotNotRequest {
  uint64 instance_id = 1;
  int64 a = 2;
}

message DeMorganRequest {
  uint64 instance_id = 1;
  int64 a = 2;
  int64 b = 3;
}

message TotalRequest {
  uint64 instance_id = 1;
  int64 a = 2;
}

message EdgesRequest {
  uint64 instance_id = 1;
  int64 a = 2;
}

message MeanRequest {
  uint64 instance_id = 1;
  int64 a = 2;
}

message BinRequest {
  uint64 instance_id = 1;
  string code = 2;
  int64 part = 3;
}

// The lifecycle states, GEAS_UNSIGNED through GEAS_BROKEN, in the runtime's
// own numbering.
enum ContractState {
  UNSIGNED = 0;
  SIGNED = 1;
  FULFILLED = 2;
  PARTIAL = 3;
  BROKEN = 4;
}

message PledgeError { string pledge = 1; int64 err = 2; }

message PartialRequest { uint64 instance_id = 1; }

// The partial surface, name lists in the runtime's insertion order.
// repeated, not map, so the order Geas pins as normative survives the
// wire.
message PartialReply {
  ContractState state = 1;
  repeated string fulfilled = 2;
  repeated string pending = 3;
  repeated string broken = 4;
  repeated PledgeError errors = 5;
}

message BreakRequest { uint64 instance_id = 1; }
message BreakReply {}

service Stock {
  // Signs, then holds. The first event carries the signature; the stream
  // then stays open and empty for as long as the instance lives. Ending the
  // stream, by close, by cancel, or by dying, ends the instance.
  rpc Session(SignRequest) returns (stream SessionEvent);
  // A parked instance stood back up: the stream is once again the
  // instance's life, and its first event carries the signature.
  rpc Resume(ResumeRequest) returns (stream SessionEvent);
  rpc Drop(DropRequest) returns (UnitStoreErrorResult);
  rpc Named(NamedRequest) returns (PartsListStoreErrorResult);
  rpc Outside(OutsideRequest) returns (PartsListStoreErrorResult);
  rpc Top(TopRequest) returns (PartsListStoreErrorResult);
  rpc NotNot(NotNotRequest) returns (PartsListStoreErrorResult);
  rpc DeMorgan(DeMorganRequest) returns (IntStoreErrorResult);
  rpc Total(TotalRequest) returns (FloatStoreErrorResult);
  rpc Edges(EdgesRequest) returns (IntOptionStoreErrorResult);
  rpc Mean(MeanRequest) returns (FloatOptionStoreErrorResult);
  rpc Bin(BinRequest) returns (UnitStoreErrorResult);
  rpc GetPartial(PartialRequest) returns (PartialReply);
  rpc Break(BreakRequest) returns (BreakReply);
}
