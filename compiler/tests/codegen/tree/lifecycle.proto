message DriverBadResumeRequest {
  uint64 instance_id = 1;
}

// The lifecycle states, GEAS_UNSIGNED through GEAS_BROKEN, in the runtime's
// own numbering.
enum ContractState {
  UNSIGNED = 0;
  SIGNED = 1;
  FULFILLED = 2;
  PARTIAL = 3;
  BROKEN = 4;
}

message PledgeError { string pledge = 1; int64 err = 2; }

message PartialRequest { uint64 instance_id = 1; }

// The partial surface, name lists in the runtime's insertion order.
// repeated, not map, so the order Geas pins as normative survives the
// wire.
message PartialReply {
  ContractState state = 1;
  repeated string fulfilled = 2;
  repeated string pending = 3;
  repeated string broken = 4;
  repeated PledgeError errors = 5;
}

message BreakRequest { uint64 instance_id = 1; }
message BreakReply {}

service Counter {
  // Signs, then holds. The first event carries the signature; the stream
  // then stays open and empty for as long as the instance lives. Ending the
  // stream, by close, by cancel, or by dying, ends the instance.
  rpc Session(CounterSignRequest) returns (stream CounterSessionEvent);
  // A parked instance stood back up: the stream is once again the
  // instance's life, and its first event carries the signature.
  rpc Resume(CounterResumeRequest) returns (stream CounterSessionEvent);
  rpc Bump(CounterBumpRequest) returns (IntIntResult);
  rpc GetPartial(PartialRequest) returns (PartialReply);
  rpc Break(BreakRequest) returns (BreakReply);
}

service Duo {
  // Signs, then holds. The first event carries the signature; the stream
  // then stays open and empty for as long as the instance lives. Ending the
  // stream, by close, by cancel, or by dying, ends the instance.
  rpc Session(DuoSignRequest) returns (stream DuoSessionEvent);
  // A parked instance stood back up: the stream is once again the
  // instance's life, and its first event carries the signature.
  rpc Resume(DuoResumeRequest) returns (stream DuoSessionEvent);
  rpc First(DuoFirstRequest) returns (BoolIntResult);
  rpc Second(DuoSecondRequest) returns (BoolIntResult);
  rpc GetPartial(PartialRequest) returns (PartialReply);
  rpc Break(BreakRequest) returns (BreakReply);
}

service Driver {
  // Signs, then holds. The first event carries the signature; the stream
  // then stays open and empty for as long as the instance lives. Ending the
  // stream, by close, by cancel, or by dying, ends the instance.
  rpc Session(DriverSignRequest) returns (stream DriverSessionEvent);
  // A parked instance stood back up: the stream is once again the
  // instance's life, and its first event carries the signature.
  rpc Resume(DriverResumeRequest) returns (stream DriverSessionEvent);
  rpc Walk(DriverWalkRequest) returns (StringIntResult);
  rpc Panel(DriverPanelRequest) returns (StringIntResult);
  rpc BadPark(DriverBadParkRequest) returns (BoolIntResult);
  rpc BadResume(DriverBadResumeRequest) returns (BoolIntResult);
  rpc GetPartial(PartialRequest) returns (PartialReply);
  rpc Break(BreakRequest) returns (BreakReply);
}
