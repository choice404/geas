// steps.proto: generated by geas emit-proto, do not edit.
// Every pledge is its own typed rpc, so a consumer gets the contract's
// argument and result types from protoc alone, with no generic Value
// envelope and no language side dispatch on a pledge name string. The
// session wrapper emitted beside this file carries the one thing protoc
// cannot, the stream whose lifetime is the instance's.

syntax = "proto3";
package geas.steps;

// The Go package the emitted session wrapper lives in; a consumer that
// lays its module out differently overrides this with protoc's M flags.
option go_package = "geasbridge/stepspb";

// contract Steps, version 1, shape 0xfc7f51a5489f0c9a.
// The sign surface: one optional field per vow, and the shape check,
// where 0 skips it and the wrapper's pinned hash enforces this build.
message StepsSignRequest {
  uint64 expected_hash = 1;
}

// The signature: the id the pledge rpcs are keyed by, the effective vows
// after defaults and overrides, and the hash and timestamp an in process
// host reads off the handle.
message StepsSigned {
  uint64 instance_id = 1;
  uint64 shape_hash = 2;
  int64 signed_at = 3;
  string park_token = 4;  // the resume key a park enabled server issues; empty when parking is off
}

// What the session stream carries. Signed is the first event; the stream's
// other job is holding the session open, and anything a server later needs
// to push arrives as another arm.
message StepsSessionEvent {
  oneof event {
    StepsSigned signed = 1;
  }
}

// The resume call: the token names a parked row on the server's park
// store, and a 0 expected_hash skips the shape check the way sign's does.
message StepsResumeRequest {
  string park_token = 1;
  uint64 expected_hash = 2;
}

// The Ok of a pledge that answers with nothing; the message is the value.
message Unit {}

message ExitErrorExited {
  int64 code = 1;
}

message ExitErrorSignaled {
  int64 number = 1;
}

message ExitErrorSpawnFailed {
  string reason = 1;
}

// The declared sum ExitError: an arm carries fields, so it crosses as a
// message whose oneof numbering is the declared arm order, the ABI's tag space.
message ExitError {
  oneof arm {
    ExitErrorExited exited = 1;
    ExitErrorSignaled signaled = 2;
    ExitErrorSpawnFailed spawn_failed = 3;
  }
}

// Result<Unit, ExitError>: the contract's own Err is a value, not a
// transport error.
message UnitExitErrorResult {
  oneof result {
    Unit ok = 1;
    ExitError err = 2;
  }
}

// The declared record Command, fields in declaration order.
message Command {
  string program = 1;
  repeated string args = 2;
  string stdout_path = 3;
  string stderr_path = 4;
}

message StepsRunRequest {
  uint64 instance_id = 1;
  Command command = 2;
}

message StepsCopyRequest {
  uint64 instance_id = 1;
  string target = 2;
}

// contract ProgramRemedy, version 1, shape 0x05d011f668f80da4.
// The sign surface: one optional field per vow, and the shape check,
// where 0 skips it and the wrapper's pinned hash enforces this build.
message ProgramRemedySignRequest {
  optional string output_path = 1;  // the vow; no default is declared, so unset refuses at sign
  uint64 expected_hash = 2;
}

// The signature: the id the pledge rpcs are keyed by, the effective vows
// after defaults and overrides, and the hash and timestamp an in process
// host reads off the handle.
message ProgramRemedySigned {
  uint64 instance_id = 1;
  string output_path = 2;
  uint64 shape_hash = 3;
  int64 signed_at = 4;
  string park_token = 5;  // the resume key a park enabled server issues; empty when parking is off
}

// What the session stream carries. Signed is the first event; the stream's
// other job is holding the session open, and anything a server later needs
// to push arrives as another arm.
message ProgramRemedySessionEvent {
  oneof event {
    ProgramRemedySigned signed = 1;
  }
}

// The resume call: the token names a parked row on the server's park
// store, and a 0 expected_hash skips the shape check the way sign's does.
message ProgramRemedyResumeRequest {
  string park_token = 1;
  uint64 expected_hash = 2;
}

message ProgramRemedyPrepareRequest {
  uint64 instance_id = 1;
}

message ProgramRemedyFailRequest {
  uint64 instance_id = 1;
}

// The lifecycle states, GEAS_UNSIGNED through GEAS_REMEDYING, in the
// runtime's own numbering. REMEDYING is the break decided with the remedies
// still running, and it is always followed by BROKEN.
enum ContractState {
  UNSIGNED = 0;
  SIGNED = 1;
  FULFILLED = 2;
  PARTIAL = 3;
  BROKEN = 4;
  REMEDYING = 5;
}

message PledgeError { string pledge = 1; int64 err = 2; }

message PartialRequest { uint64 instance_id = 1; }

// The partial surface, name lists in the runtime's insertion order.
// repeated, not map, so the order Geas pins as normative survives the
// wire.
message PartialReply {
  ContractState state = 1;
  repeated string fulfilled = 2;
  repeated string pending = 3;
  repeated string broken = 4;
  repeated PledgeError errors = 5;
}

message BreakRequest { uint64 instance_id = 1; }
message BreakReply {}

service Steps {
  // Signs, then holds. The first event carries the signature; the stream
  // then stays open and empty for as long as the instance lives. Ending the
  // stream, by close, by cancel, or by dying, ends the instance.
  rpc Session(StepsSignRequest) returns (stream StepsSessionEvent);
  // A parked instance stood back up: the stream is once again the
  // instance's life, and its first event carries the signature.
  rpc Resume(StepsResumeRequest) returns (stream StepsSessionEvent);
  rpc Run(StepsRunRequest) returns (UnitExitErrorResult);
  rpc Copy(StepsCopyRequest) returns (UnitExitErrorResult);
  rpc GetPartial(PartialRequest) returns (PartialReply);
  rpc Break(BreakRequest) returns (BreakReply);
}

service ProgramRemedy {
  // Signs, then holds. The first event carries the signature; the stream
  // then stays open and empty for as long as the instance lives. Ending the
  // stream, by close, by cancel, or by dying, ends the instance.
  rpc Session(ProgramRemedySignRequest) returns (stream ProgramRemedySessionEvent);
  // A parked instance stood back up: the stream is once again the
  // instance's life, and its first event carries the signature.
  rpc Resume(ProgramRemedyResumeRequest) returns (stream ProgramRemedySessionEvent);
  rpc Prepare(ProgramRemedyPrepareRequest) returns (UnitExitErrorResult);
  rpc Fail(ProgramRemedyFailRequest) returns (UnitExitErrorResult);
  rpc GetPartial(PartialRequest) returns (PartialReply);
  rpc Break(BreakRequest) returns (BreakReply);
}
